{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - DocMed Premium{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: 100vh; background: linear-gradient(135deg, #F8FBFF 0%, #E1EBFF 100%); display: flex; align-items: center; justify-content: center; padding: 40px 0;">
  
  <div class="medical-shapes">
    <div class="medical-shape shape-1"><i class="fa fa-plus-circle"></i></div>
    <div class="medical-shape shape-2"><i class="fa fa-heartbeat"></i></div>
  </div>

  <div class="login-card-container" data-aos="zoom-in" data-aos-duration="1000" style="width: 100%; max-width: 520px; z-index: 10;">
    <div class="premium-login-card p-5" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08);">
      
      <!-- Card Header -->
      <div class="text-center mb-5">
        <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; background: rgba(6, 182, 212, 0.1); border-radius: 50%;">
          <i class="fa fa-key fa-2x text-primary" style="color: #4f46e5 !important;"></i>
        </div>
        <h3 class="font-weight-bold text-dark mb-1">Forgot Password?</h3>
        <p class="text-muted">Enter your registered email address or phone number to reset your password.</p>
      </div>

      <!-- Password Reset Form -->
      <form action="{% url 'accounts:password_reset' %}" method="POST" id="passwordResetForm" data-loading>
        {% csrf_token %}

        <!-- Input Field (Email or Phone) -->
        <div class="form-floating-custom mb-4 position-relative">
          <input type="text" name="email_or_phone" id="id_email_or_phone" placeholder=" " required>
          <i class="fa fa-envelope input-icon"></i>
          <label for="id_email_or_phone">Email or Phone Number</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-premium btn-primary-gradient w-100 py-3 mb-4 shadow-glow" style="background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white; border: 0; border-radius: 12px; font-weight: 700;">
          <span class="btn-text">Send Verification <i class="fa fa-paper-plane ml-2"></i></span>
          <span class="btn-spinner spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
        </button>
      </form>

      <!-- Back to Login -->
      <div class="text-center pt-3 border-top small font-weight-bold" style="border-color: rgba(0,0,0,0.08) !important;">
        <a href="{% url 'accounts:login' %}" class="text-primary" style="color: #4f46e5;"><i class="fa fa-arrow-left mr-1"></i> Back to Login</a>
      </div>

    </div>
  </div>

</div>
{% endblock %}
