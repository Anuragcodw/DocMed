{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - DocMed Premium{% endblock %}

{% block content %}
<div class="auth-wrapper">
  
  <div class="login-card-container" data-aos="zoom-in" data-aos-duration="1000">
    <div class="premium-login-card p-5 text-center">
      
      <div class="d-inline-flex align-items-center justify-content-center mb-4" style="width: 70px; height: 70px; background: rgba(16, 185, 129, 0.1); border-radius: 50%;">
        <i class="fa fa-check-circle fa-2x text-success"></i>
      </div>
      
      <h3 class="font-weight-bold text-dark mb-2">Password Reset Successful</h3>
      <p class="text-muted mb-4">
        Your password has been successfully reset. You can now log in using your new credentials.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn-premium btn-primary-gradient w-100 py-3 mb-4 shadow-glow">
        <i class="fa fa-sign-in mr-2"></i> Log In
      </a>

    </div>
  </div>

</div>
{% endblock %}
