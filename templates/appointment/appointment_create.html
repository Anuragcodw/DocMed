{% extends 'base.html' %}
{% load glass_form %}

{% block title %} Create Appointment Slot - Premium Healthcare Portal {% blocktitle %}

{% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 mb-5">
      <div class="glass-panel custom-form-card" style="margin-top: 100px;">
        <center>
          <div style="font-size: 40px; color: var(--primary-indigo); margin-bottom: 10px;"><i class="fa fa-plus-circle"></i></div>
          <h3 style="font-weight: 800; margin-bottom: 30px;">Post Appointment Slot</h3>
        </center>

        <form action="" method="POST" enctype="multipart/form-data">{% csrf_token %}
          <div class="mb-4">
            {% render_glass_form form %}
          </div>

          <button type="submit" class="btn-gradient btn-cyan btn-block text-white mt-4" style="justify-content: center; height: 50px; font-size: 16px;">
            <i class="fa fa-cloud-upload"></i> Create Slot
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
