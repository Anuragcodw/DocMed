{% extends 'base.html' %}

{% block title %}Delete Slot Confirmation - Premium Healthcare Portal{% endblock %}

{% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 mb-5">
      <div class="glass-panel custom-form-card" style="margin-top: 100px; text-align: center;">
        <div style="font-size: 56px; color: #ef4444; margin-bottom: 20px;"><i class="fa fa-exclamation-triangle"></i></div>
        <h4 style="font-weight: 800; margin-bottom: 20px; line-height: 1.4;">Are you sure you want to delete {{ object.full_name }}'s Appointment Slot?</h4>
        
        <form method="post" enctype="multipart/form-data">{% csrf_token %}
          {% if object.image %}
            <div class="mb-4" style="border-radius: 16px; overflow: hidden; height: 280px; width: 100%; border: 1px solid var(--theme-card-border);">
              <img style="height: 100%; width: 100%; object-fit: cover;" src="{{ object.image.url }}" alt="{{ object.full_name }}">
            </div>
          {% endif %}
          
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'appointment:doctor-appointment' %}" class="btn-glass" style="width: 120px; padding: 12px 0;"><i class="fa fa-arrow-left"></i> Back</a>
            <button class="btn-gradient" type="submit" style="background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); width: 120px; padding: 12px 0; justify-content: center;">
              <i class="fa fa-trash"></i> Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
