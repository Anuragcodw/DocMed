{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 — Server Error | DocMed</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0a0a1a 0%,#1a0d0d 50%,#0a0a1a 100%);
      font-family:'Poppins',sans-serif;overflow:hidden;position:relative}
    body::before{content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 30% 40%,rgba(239,68,68,0.12) 0%,transparent 60%),
                 radial-gradient(ellipse at 70% 70%,rgba(99,102,241,0.08) 0%,transparent 60%);pointer-events:none}
    .error-card{text-align:center;padding:60px 50px;
      background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);
      border:1px solid rgba(239,68,68,0.15);border-radius:28px;
      box-shadow:0 25px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.06);
      max-width:580px;width:90%;animation:fadeInUp .8s ease}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .err-code{font-size:120px;font-weight:800;line-height:1;
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
    .err-icon{font-size:64px;color:#ef4444;margin-bottom:20px;display:block;
      animation:shake .5s ease-in-out infinite alternate}
    @keyframes shake{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
    h2{color:#fff;font-size:28px;font-weight:700;margin-bottom:12px}
    p{color:rgba(255,255,255,0.55);font-size:16px;margin-bottom:36px;line-height:1.7}
    .btn-back{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;
      background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
      border-radius:50px;text-decoration:none;font-weight:600;font-size:15px;
      transition:all .3s;box-shadow:0 8px 24px rgba(239,68,68,0.35)}
    .btn-back:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(239,68,68,0.5);color:#fff}
  </style>
</head>
<body>
  <div class="error-card">
    <span class="err-icon"><i class="ri-error-warning-line"></i></span>
    <div class="err-code">500</div>
    <h2>Internal Server Error</h2>
    <p>Something went wrong on our end. Our team has been notified.<br>
       Please try again in a few minutes.</p>
    <a href="/" class="btn-back"><i class="ri-arrow-left-line"></i> Back to Home</a>
  </div>
</body>
</html>
