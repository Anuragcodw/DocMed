services:
  - type: web
    name: docmed-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn doctor_appointment_system.wsgi:application --log-file -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "generate_a_random_secret_key_for_production_deployments"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        value: "mysql://user:password@host:port/dbname"
      - key: AI_ANALYSIS_ENABLED
        value: "True"
      - key: GEMINI_API_KEY
        value: "YOUR_GEMINI_API_KEY"
